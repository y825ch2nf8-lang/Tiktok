<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;src:url(fonts/InstrumentSerif-Italic.ttf)}
@font-face{font-family:"Inter Tight";font-weight:500;src:url(fonts/InterTight-500.ttf)}
@font-face{font-family:"Inter Tight";font-weight:600;src:url(fonts/InterTight-600.ttf)}
@font-face{font-family:"Inter Tight";font-weight:800;src:url(fonts/InterTight-800.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head><body>
<canvas id="c"></canvas>
<script>
// ---------- format ----------
const FEED=new URLSearchParams(location.search).has('feed');
const W=1080,H=FEED?1350:1920,DUR=23;
const BPM=90,B=60/BPM;                       // every cut sits on the beat grid
const S=FEED?.82:1;                           // type scale
const L=FEED?72:84;                           // left margin
const T0=FEED?70:270, B0=FEED?H-80:1450;      // text-safe area (clear of Reels/TikTok UI)
const INK='#0f0d0b',CREAM='#f3ede4',ACC='#f2a65a';
const GRADE='contrast(1.08) saturate(0.86) brightness(0.92) sepia(0.10)';

const K=+(new URLSearchParams(location.search).get('k')||1);   // backing-store scale (2 = 4K)
const main=document.getElementById('c');main.width=W*K;main.height=H*K;main.style.width=W+'px';main.style.height=H+'px';const m=main.getContext('2d');m.setTransform(K,0,0,K,0,0);
const buf=document.createElement('canvas');buf.width=W*K;buf.height=H*K;const x=buf.getContext('2d');x.setTransform(K,0,0,K,0,0);
x.imageSmoothingQuality='high';m.imageSmoothingQuality='high';
const kf=f=>f.replace(/blur\(([\d.]+)px\)/g,(_,v)=>`blur(${v*K}px)`);
const I={};
const load=n=>new Promise(r=>{const i=new Image();i.onload=()=>{I[n]=i;r()};i.src='img/'+n+'.jpg'});

// ---------- helpers ----------
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const outExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
const hh=(t,k=1)=>({dx:k*(Math.sin(t*.9+1)*5+Math.sin(t*2.3)*2.2),dy:k*(Math.cos(t*.7)*6+Math.sin(t*1.7+2)*2.4),rot:k*Math.sin(t*.5)*.0022});

function photo(im,X,Y,w,h,o={}){
  const z=o.zoom||1,fx=o.fx??.5,fy=o.fy??.5,M=24;
  let s=Math.max(w/im.width,h/im.height)*z;
  s=Math.max(s,(w+2*M)/im.width,(h+2*M)/im.height);
  const dw=im.width*s,dh=im.height*s;
  let ix=X+w/2-fx*dw, iy=Y+h/2-fy*dh;
  ix=Math.min(X-M,Math.max(X+w-dw+M,ix)); iy=Math.min(Y-M,Math.max(Y+h-dh+M,iy));
  x.save();x.beginPath();x.rect(X,Y,w,h);x.clip();
  x.translate(X+w/2+(o.dx||0),Y+h/2+(o.dy||0));x.rotate(o.rot||0);x.translate(-(X+w/2),-(Y+h/2));
  x.filter=kf(o.grade||GRADE);x.drawImage(im,ix,iy,dw,dh);x.restore();
}
function shade(y0,a){const g=x.createLinearGradient(0,y0,0,H);g.addColorStop(0,'rgba(10,8,6,0)');g.addColorStop(.45,`rgba(10,8,6,${a*.82})`);g.addColorStop(1,`rgba(10,8,6,${a})`);x.fillStyle=g;x.fillRect(0,y0,W,H-y0)}
function topShade(){const g=x.createLinearGradient(0,0,0,H*.22);g.addColorStop(0,'rgba(10,8,6,.45)');g.addColorStop(1,'rgba(10,8,6,0)');x.fillStyle=g;x.fillRect(0,0,W,H*.22)}

const F={
  serif:(s,c=CREAM)=>({font:`italic 400 ${s}px "Instrument Serif"`,size:s,color:c,track:-s*.01}),
  sans:(s,c=CREAM,w=800)=>({font:`${w} ${s}px "Inter Tight"`,size:s,color:c,track:-s*.035}),
  label:(s,c=CREAM)=>({font:`600 ${s}px "Inter Tight"`,size:s,color:c,track:s*.22}),
};
function setFont(f){x.font=f.font;x.letterSpacing=(f.track||0)+'px'}
// masked line reveal: text rises out of an invisible slot (outExpo)
function line(str,X,Y,f,t0,l,o={}){
  if(l<t0)return;
  const p=outExpo(cl((l-t0)/(o.d||.8)));
  setFont(f);x.textBaseline='alphabetic';x.textAlign='left';
  const w=x.measureText(str).width;
  const lx=o.align==='center'?X-w/2:o.align==='right'?X-w:X;
  x.save();x.beginPath();x.rect(lx-40,Y-f.size*1.02,w+80,f.size*1.34);x.clip();
  x.globalAlpha*=(o.alpha??1)*Math.min(1,p*1.8);x.fillStyle=f.color;
  x.fillText(str,lx,Y+(1-p)*f.size*1.15);x.restore();
}
function rule(x0,y,x1,t0,l,col='rgba(243,237,228,.28)',lw=1.5){
  if(l<t0)return;const p=outExpo(cl((l-t0)/.9));
  x.strokeStyle=col;x.lineWidth=lw;x.beginPath();x.moveTo(x0,y);x.lineTo(x0+(x1-x0)*p,y);x.stroke();
}

// ---------- shots ----------
function shotA(l,t){ // hook: facade, title
  photo(I.crowd,0,0,W,H,{zoom:(FEED?1.45:1.3)+l*.03,fx:.5,fy:.38+.22*(1-Math.pow(1-cl(l/(4*B)),2)),...hh(t)});
  topShade();shade(H*.34,.92);
  const y2=B0-30*S,y1=y2-160*S,yl=y1-190*S;
  line('06.—08.11.  ·  BONNER INNENSTADT',L,yl,F.label(26*S,ACC),.10,l);
  line('Bonn',L,y1,F.serif(235*S),.22,l);
  line('leuchtet.',L,y2,F.sans(150*S),.36,l);
}
const WORDS=[
  {im:'crowd',zoom:1.0,fx:.5,fy:.5,w:'Lichter.'},
  {im:'crowd',zoom:1.35,fx:.28,fy:.88,w:'Musik.'},
  {im:'crowd',zoom:1.4,fx:.86,fy:.3,w:'Food.'},
  {im:'crowd',zoom:1.45,fx:0,fy:.5,w:'Drei Tage.',serif:true},
];
function wordShot(i){return (l,t)=>{
  const c=WORDS[i];let z=c.zoom*(1+l*.06);if(i===0)z*=1+.12*Math.exp(-l*10);
  photo(I[c.im],0,0,W,H,{zoom:z,fx:c.fx,fy:c.fy,...hh(t)});
  x.fillStyle='rgba(10,8,6,.34)';x.fillRect(0,0,W,H);
  const f=c.serif?F.serif(215*S):F.sans(165*S);
  const sc=1+.05*(1-outExpo(cl(l/.3)));
  x.save();x.translate(W/2,H*.5);x.scale(sc,sc);setFont(f);x.textAlign='center';x.textBaseline='middle';x.fillStyle=CREAM;x.fillText(c.w,0,0);x.restore();
  setFont(F.label(22*S));x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(243,237,228,.7)';x.fillText(`0${i+1} — 04`,W/2,H*.5+150*S);
}}
function shotC(l,t){ // editorial: the bar
  const yl=T0+40*S+(FEED?0:110),y1=yl+180*S,y2=y1+140*S,imgY=y2+95*S,imgH=FEED?H-imgY-60:760;
  const p=outExpo(cl((l-.05)/.95));
  x.save();x.beginPath();x.rect(0,imgY,W,imgH*p);x.clip();
  photo(I.bar,0,imgY,W,imgH,{zoom:1.12-.05*p+l*.02,fx:.5,fy:.5,...hh(t,.5)});x.restore();
  line('MITTENDRIN',L,yl,F.label(26*S,ACC),.08,l);
  line('BY KEHL EVENT',W-L,yl,F.label(22*S),.08,l,{align:'right',alpha:.6});
  line('Vino &',L,y1,F.serif(205*S),.20,l);
  line('Spritz Bar.',L,y2,F.sans(140*S),.34,l);
}
function shotD(l,t){ // tighter on the bar, three beats of copy
  const imgH=FEED?640:900;
  photo(I.bar,0,0,W,imgH,{zoom:1.2+l*.035,fx:.5,fy:.42,...hh(t,.8)});
  const yl=imgH+100*S;
  line('AN DER BAR',L,yl,F.label(26*S,ACC),.05,l);
  [['Gute Weine.',F.sans(80*S)],['Feiner Spritz.',F.sans(80*S)],['Gute Gesellschaft.',F.serif(104*S)]]
    .forEach((r,i)=>line(r[0],L,yl+(118+i*106)*S,r[1],.10+i*B,l));
}
const ROWS=[
  ['FR 06.11.  ·  17:50 UHR','Eröffnung mit Chor-Auftritt'],
  ['SA 07.11.  ·  17:30 UHR','Tanzaktionen in der City'],
  ['SO 08.11.  ·  13–18 UHR','Verkaufsoffener Sonntag'],
  ['SO 08.11.  ·  AB 17 UHR','Beleuchtung der Stadttore'],
];
function shotE(l,t){ // programme
  x.save();x.globalAlpha=.35;photo(I.rathaus,0,0,W,H,{zoom:1.1+l*.02,fx:.5,fy:.5,grade:GRADE+' blur(10px) brightness(.6)'});x.restore();
  x.fillStyle='rgba(15,13,11,.72)';x.fillRect(0,0,W,H);
  x.save();x.translate(0,-l*5*S);
  const yl=T0+40*S+(FEED?110:0),yh=yl+185*S,ry0=yh+90*S,RH=(FEED?178:172)*S;
  line('06.—08. NOVEMBER 2026',L,yl,F.label(26*S,ACC),.05,l);
  line('Programm',L,yh,F.serif(195*S),.15,l);
  ROWS.forEach((r,i)=>{const st=.33+i*B,y=ry0+i*RH;
    rule(L,y,W-L,st,l);
    line(r[0],L,y+60*S,F.label(23*S,ACC),st+.08,l);
    line(r[1],L,y+126*S,F.sans(52*S,CREAM,600),st+.16,l);
  });
  rule(L,ry0+4*RH,W-L,.33+4*B,l);
  x.restore();
}
function shotF(l,t){ // invitation over the crowd
  photo(I.crowd,0,0,W,H,{zoom:(FEED?1.6:1.5)-l*.04,fx:.72,fy:1,...hh(t)});
  topShade();shade(H*.32,.88);
  const y2=B0-30*S,y1=y2-128*S,yl=y1-180*S;
  line('BIS SONNTAG, 08.11.',L,yl,F.label(26*S,ACC),.08,l);
  line('Kommt vorbei',L,y1,F.serif(178*S),.20,l);
  line('& stoßt mit uns an.',L,y2,F.sans(78*S),.36,l);
}
function shotG(l,t){ // end card
  const cy=FEED?H*.5:H*.45,push=1+l*.007;
  x.save();x.translate(W/2,cy);x.scale(push,push);x.translate(-W/2,-cy);
  const lp=outExpo(cl((l-.05)/1)),R=104*S,ly=cy-265*S+(1-lp)*24;
  x.save();x.globalAlpha=lp;x.beginPath();x.arc(W/2,ly,R,0,7);x.clip();const lk=I.logo.width/300;x.drawImage(I.logo,34*lk,32*lk,232*lk,232*lk,W/2-R,ly-R,2*R,2*R);x.restore();
  x.save();x.globalAlpha=lp*.35;x.strokeStyle=CREAM;x.lineWidth=1.5;x.beginPath();x.arc(W/2,ly,R+16,0,7);x.stroke();x.restore();
  line('Vino & Spritz Bar',W/2,cy-5*S,F.serif(130*S),.20,l,{align:'center'});
  line('@kehl_event',W/2,cy+88*S,F.sans(46*S,CREAM,600),.42,l,{align:'center'});
  rule(W/2-60,cy+158*S,W/2+60,.62,l,ACC,2);
  line('BONN LEUCHTET  ·  06.—08.11.2026',W/2,cy+240*S,F.label(23*S),.75,l,{align:'center',alpha:.75});
  line('BONNER INNENSTADT',W/2,cy+290*S,F.label(23*S),.88,l,{align:'center',alpha:.75});
  x.restore();
}
const SHOTS=[
  {a:0,b:4*B,f:shotA},
  {a:4*B,b:5*B,f:wordShot(0)},{a:5*B,b:6*B,f:wordShot(1)},{a:6*B,b:7*B,f:wordShot(2)},{a:7*B,b:8*B,f:wordShot(3)},
  {a:8*B,b:12*B,f:shotC},
  {a:12*B,b:16*B,f:shotD},
  {a:16*B,b:24*B,f:shotE},
  {a:24*B,b:28*B,f:shotF},
  {a:28*B,b:DUR+1,f:shotG},
];

// ---------- finishing ----------
const grains=[...Array(6)].map(()=>{const c=document.createElement('canvas');c.width=W*K/2;c.height=H*K/2;const g=c.getContext('2d');
  const d=g.createImageData(c.width,c.height);for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()+Math.random()-1)*70;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  g.putImageData(d,0,0);return c});
function drawShot(t){x.save();x.filter='none';x.fillStyle=INK;x.fillRect(0,0,W,H);
  const s=SHOTS.find(s=>t>=s.a&&t<s.b);s.f(t-s.a,t);x.restore()}
function whip(t,tc,w){ // directional motion-blur whip pan across the cut
  const before=t<tc,p=before?(t-(tc-w))/w:1-(t-tc)/w,e=p*p*p;
  const off=(before?-1:1)*e*W*.55,spread=e*300,n=12;
  m.fillStyle=INK;m.fillRect(0,0,W,H);
  for(let i=0;i<n;i++){m.globalAlpha=1/(i+1);m.drawImage(buf,off+spread*(i/(n-1)-.5),0,W,H)}
  m.globalAlpha=1;
}
function leak(t,tc){ // warm light leak peaking on the cut
  const p=(t-(tc-.35))/.95;if(p<=0||p>=1)return;const k=Math.pow(Math.sin(Math.PI*p),1.4);
  m.save();m.globalCompositeOperation='screen';
  const g1=m.createRadialGradient(W*(1.15-p*.9),H*.3,0,W*(1.15-p*.9),H*.3,H*.75);
  g1.addColorStop(0,`rgba(255,120,45,${.9*k})`);g1.addColorStop(1,'rgba(255,120,45,0)');m.fillStyle=g1;m.fillRect(0,0,W,H);
  const g2=m.createRadialGradient(W*(-.15+p*.7),H*.78,0,W*(-.15+p*.7),H*.78,H*.5);
  g2.addColorStop(0,`rgba(255,200,110,${.65*k})`);g2.addColorStop(1,'rgba(255,200,110,0)');m.fillStyle=g2;m.fillRect(0,0,W,H);
  m.fillStyle=`rgba(255,150,70,${.18*k})`;m.fillRect(0,0,W,H);m.restore();
}
function render(t){
  const tc=12*B,ww=.12;
  drawShot(t);
  if(Math.abs(t-tc)<ww)whip(t,tc,ww);else{m.globalAlpha=1;m.drawImage(buf,0,0,W,H)}
  const fd=t-4*B;if(fd>=0&&fd<.35){m.fillStyle=`rgba(255,248,235,${.45*Math.exp(-fd*12)})`;m.fillRect(0,0,W,H)}
  leak(t,8*B);leak(t,24*B);
  const v=m.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.78);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.42)');m.fillStyle=v;m.fillRect(0,0,W,H);
  m.save();m.globalCompositeOperation='overlay';m.globalAlpha=.45;m.drawImage(grains[Math.round(t*30)%6],0,0,W,H);m.restore();
  const fade=Math.max(1-t/.15,1-(DUR-t)/.7,0);if(fade>0){m.fillStyle=`rgba(0,0,0,${cl(fade)})`;m.fillRect(0,0,W,H)}
}
window.DUR=DUR;window.render=render;window.prepare=async()=>{};
window.ready=(async()=>{
  await Promise.all(['crowd','bar','rathaus','logo'].map(load));
  await Promise.all(['italic 400 40px "Instrument Serif"','500 40px "Inter Tight"','600 40px "Inter Tight"','800 40px "Inter Tight"'].map(f=>document.fonts.load(f,'Aäß—·')));
  render(0);return true;
})();
</script></body></html>
